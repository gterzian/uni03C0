name: Client
options:
  bundleIdPrefix: com.uni03c0
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
packages:
  Subprocess:
    url: https://github.com/swiftlang/swift-subprocess
    from: "1.0.0"
targets:
  Core:
    type: framework
    platform: macOS
    sources:
      - Core
    dependencies:
      - package: Subprocess
        product: Subprocess
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uni03c0.Core
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  SandboxLauncher:
    type: tool
    platform: macOS
    sources:
      - SandboxLauncher
    settings:
      base:
        PRODUCT_NAME: sandbox-launcher
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  Client:
    type: application
    platform: macOS
    sources:
      - Client
    dependencies:
      - target: Core
        embed: true
      - target: SandboxLauncher
      - package: Subprocess
        product: Subprocess
    postCompileScripts:
      - name: Copy sandbox launcher into the app bundle
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}"
          cp "${BUILT_PRODUCTS_DIR}/sandbox-launcher" "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uni03c0
        PRODUCT_NAME: "uni03C0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleDisplayName: "uni03C0"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  ClientTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ClientTests
    dependencies:
      - target: Core
      - package: Subprocess
        product: Subprocess
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.uni03c0.ClientTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @loader_path/../Frameworks"

schemes:
  Client:
    build:
      targets:
        Client: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClientTests
  ClientTests:
    build:
      targets:
        Core: all
        ClientTests: [test]
    test:
      config: Debug
      targets:
        - ClientTests
